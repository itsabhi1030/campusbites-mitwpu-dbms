<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g transform="translate(100,100) rotate(-45) translate(-100,-100)" filter="url(#shadow)">
    <!-- Blue Upper Square -->
    <path d="M50 40 h100 a10 10 0 0 1 10 10 v50 h-120 v-50 a10 10 0 0 1 10 -10 z" fill="#006491"/>
    <!-- Red Lower Square -->
    <path d="M40 100 h120 v50 a10 10 0 0 1 -10 10 h-100 a10 10 0 0 1 -10 -10 v-50 z" fill="#E31837"/>
    <!-- Divider -->
    <line x1="40" y1="100" x2="160" y2="100" stroke="#FFFFFF" stroke-width="6"/>
    <!-- White Domino Dots -->
    <circle cx="100" cy="70" r="12" fill="#FFFFFF"/>
    <circle cx="75" cy="130" r="12" fill="#FFFFFF"/>
    <circle cx="125" cy="130" r="12" fill="#FFFFFF"/>
  </g>
</svg>