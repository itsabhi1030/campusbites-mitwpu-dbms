  <text x="100" y="145" text-anchor="middle" font-family="'Impact', sans-serif" font-weight="900" font-size="16" fill="#FF9800" letter-spacing="1">BARBEQUE NATION</text>
  <text x="100" y="165" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" letter-spacing="2">LIVE ON-TABLE GRILL</text>
