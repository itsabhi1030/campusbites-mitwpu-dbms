    <path d="M40 70 C20 60 25 35 32 20 C38 32 50 25 45 10 C60 25 65 50 40 70 Z" fill="#FF9800"/>
    <path d="M40 70 C30 62 32 48 38 38 C42 45 48 40 45 32 C52 42 52 58 40 70 Z" fill="#FFEB3B"/>
