<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="36" fill="#2E7D32"/>
  <!-- Juice Glass with Straw & Orange Slice -->
  <g transform="translate(65, 30)">
    <!-- Glass Body -->
    <path d="M15 30 L22 85 C24 90 46 90 48 85 L55 30 Z" fill="#FFA000"/>
    <ellipse cx="35" cy="30" rx="20" ry="6" fill="#FFD54F"/>
    <!-- Straw -->
    <line x1="38" y1="35" x2="52" y2="5" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="52" y1="5" x2="62" y2="10" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <!-- Citrus Slice on Rim -->
    <path d="M15 30 A15 15 0 0 1 15 0 Z" fill="#FF9800"/>
    <circle cx="15" cy="15" r="10" fill="#FFE082"/>
  </g>
  <text x="100" y="152" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" letter-spacing="1">JUICE JUNCTION</text>
  <text x="100" y="170" text-anchor="middle" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#A5D6A7" letter-spacing="2">COLD PRESSED &amp; SMOOTHIES</text>
</svg>