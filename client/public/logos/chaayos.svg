  </g>
  <!-- Text -->
  <text x="100" y="165" text-anchor="middle" font-family="'Century Gothic', 'Arial', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="2">Chaayos</text>
